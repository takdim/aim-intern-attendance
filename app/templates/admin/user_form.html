{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <h3 class="mb-1">{{ 'Edit User' if user else 'Tambah User' }}</h3>
  <p class="page-subtitle">Lengkapi identitas, role, dan status akun pengguna.</p>
</div>
<div class="card card-soft"><div class="card-body">
<form method="post" class="row g-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-6"><label class="form-label">Nama</label><input class="form-control" name="name" value="{{ user.name if user else '' }}" required></div>
  <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" value="{{ user.email if user else '' }}" required></div>
  <div class="col-md-6"><label class="form-label">Username</label><input class="form-control" name="username" value="{{ user.username if user else '' }}" required></div>
  <div class="col-md-6"><label class="form-label">Role</label>
    <select class="form-select" name="role_id" required>
      {% for role in roles %}
      <option value="{{ role.id }}" {% if user and user.role_id == role.id %}selected{% endif %}>{{ role.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6"><label class="form-label">Password {{ '(kosongkan jika tidak diubah)' if user else '' }}</label><input type="password" class="form-control" name="password" {{ '' if user else 'required' }}></div>
  <div class="col-md-6"><label class="form-label">Nomor Identitas</label><input class="form-control" name="identity_number" value="{{ user.identity_number if user else '' }}"></div>
  <div class="col-md-6"><label class="form-label">Nomor Telepon</label><input class="form-control" name="phone" value="{{ user.phone if user else '' }}"></div>
  <div class="col-md-6"><label class="form-label">Instansi</label><input class="form-control" name="institution" value="{{ user.institution if user else '' }}"></div>
  <div class="col-md-6"><label class="form-label">Program Studi</label><input class="form-control" name="department" value="{{ user.department if user else '' }}"></div>
  <div class="col-12 form-check"><input class="form-check-input" type="checkbox" name="is_active" {% if not user or user.is_active %}checked{% endif %}><label class="form-check-label">User Aktif</label></div>
  <div class="col-12 d-flex gap-2 flex-wrap">
    <button class="btn btn-success">Simpan</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('admin.users') }}">Kembali</a>
  </div>
</form>
</div></div>
{% endblock %}
