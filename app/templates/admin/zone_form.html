{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <h3 class="mb-1">Edit Zona</h3>
  <p class="page-subtitle">Perbarui koordinat, radius, dan status aktif zona.</p>
</div>
<div class="card card-soft"><div class="card-body">
<form method="post" class="row g-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-6"><label class="form-label">Nama Zona</label><input class="form-control" name="name" value="{{ zone.name }}" required></div>
  <div class="col-md-6"><label class="form-label">Deskripsi</label><input class="form-control" name="description" value="{{ zone.description or '' }}"></div>
  <div class="col-md-4"><label class="form-label">Latitude</label><input class="form-control" name="latitude" value="{{ zone.latitude }}" required></div>
  <div class="col-md-4"><label class="form-label">Longitude</label><input class="form-control" name="longitude" value="{{ zone.longitude }}" required></div>
  <div class="col-md-4"><label class="form-label">Radius (m)</label><input class="form-control" name="radius" value="{{ zone.radius }}" required></div>
  <div class="col-12 form-check"><input class="form-check-input" type="checkbox" name="is_active" {% if zone.is_active %}checked{% endif %}><label class="form-check-label">Aktif</label></div>
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-success">Simpan</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('admin.zones') }}">Kembali</a>
  </div>
</form>
</div></div>
{% endblock %}
