{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <h3 class="mb-1">Profil</h3>
  <p class="page-subtitle">Informasi akun peserta PKL atau magang.</p>
</div>
<div class="card card-soft"><div class="card-body">
  <p class="mb-1"><strong>Nama:</strong> {{ current_user.name }}</p>
  <p class="mb-1"><strong>Email:</strong> {{ current_user.email }}</p>
  <p class="mb-1"><strong>Username:</strong> {{ current_user.username }}</p>
  <p class="mb-0"><strong>Instansi:</strong> {{ current_user.institution or '-' }}</p>
</div></div>
{% endblock %}
